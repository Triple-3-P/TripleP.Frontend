name: Frontend checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run build
      - name: Vitest
        if: hashFiles('src/**/*.test.ts', 'src/**/*.test.tsx') != ''
        run: npm test
      - name: Install Chromium
        if: hashFiles('e2e/pages/**/*.spec.ts') != ''
        run: npx playwright install --with-deps chromium
      - name: Playwright
        if: hashFiles('e2e/pages/**/*.spec.ts') != ''
        run: npm run test:e2e
      - name: Upload Playwright results
        if: ${{ !cancelled() && hashFiles('e2e/pages/**/*.spec.ts') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
